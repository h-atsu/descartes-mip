[project]
name = "descartes-mip"
version = "0.2.0"
description = "Solver-independent modeling and automatic Lagrangian decomposition"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "h-atsu", email = "jhuim08@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "lagrangian-relaxation",
    "mathematical-optimization",
    "milp",
    "operations-research",
    "modeling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "highspy>=1.15.1",
]

[project.urls]
Documentation = "https://github.com/h-atsu/descartes-mip/blob/main/docs/api.md"
Issues = "https://github.com/h-atsu/descartes-mip/issues"
Repository = "https://github.com/h-atsu/descartes-mip"

[project.scripts]
descartes-mip = "descartes_mip:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["uv_build>=0.11.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.71",
    "typer>=0.27.3",
]
